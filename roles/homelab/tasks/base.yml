---
- name: Assert Ubuntu
  ansible.builtin.assert:
    that: ansible_facts.distribution == 'Ubuntu'
    fail_msg: This role targets Ubuntu Server.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ homelab_base_packages + homelab_gpu_packages[homelab_gpu] }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ homelab_timezone }}"

- name: Create /etc/homelab and stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/homelab
    - /opt/stacks
