---
- name: Nextcloud data directory
  ansible.builtin.file:
    path: "{{ homelab_root }}/nextcloud-data"
    state: directory
    mode: "0750"

- name: Deploy Nextcloud AIO mastercontainer
  ansible.builtin.include_tasks: _stack.yml
  vars:
    stack_name: nextcloud

- name: Reminder
  ansible.builtin.debug:
    msg: "Finish setup at https://<server-ip>:8080 (AIO shows a one-time passphrase on first visit)."
